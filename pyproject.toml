[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-impact-ai"
version = "0.1.0"
description = "Context-normalized landing-impact ranking from markerless badminton pose."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Badminton-Impact-AI Team" }]
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
badminton-impact = "badminton_impact_ai.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
train = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["badminton_impact_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
