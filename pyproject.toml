[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-impact-ai"
version = "1.0.0"
description = "Context-relative ranking of badminton landing events from markerless pose."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kuoye Niu et al." }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/KenyaNiu/BadmintonImpact"

[project.scripts]
badminton-impact = "badminton_impact_ai.cli:main"

[project.optional-dependencies]
train = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["badminton_impact_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B905"]  # zip(strict=...) is applied where lengths must match

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
