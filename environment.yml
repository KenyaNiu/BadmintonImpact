# Conda environment aligned with the developers' `badminton_grf` setup:
#   Python 3.10 + conda NumPy/SciPy/Pandas + pip PyTorch/torchvision (CUDA on Linux).
#
# Reference versions (Linux, `conda activate badminton_grf`): Python 3.10.20,
# numpy 2.2.5, scipy 1.15.3, pandas 2.3.3, torch 2.11.0, torchvision 0.26.0,
# scikit-learn 1.7.2, pytest 9.0.3, opencv-python 4.13.0.92.
#
# Create:
#   conda env create -f environment.yml
#   conda activate badminton_grf
#   pip install -e ".[dev,train]"
#
# Update:
#   conda env update -f environment.yml --prune
#
# CPU-only PyTorch (optional):
#   pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cpu
#
name: badminton_grf
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.*
  - pip
  - numpy>=2.2,<3
  - scipy>=1.15,<2
  - pandas>=2.3,<3
  - matplotlib>=3.10,<4
  - seaborn>=0.13,<1
  - ffmpeg
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - scikit-learn==1.7.2
      - pytest==9.0.3
      - opencv-python==4.13.0.92
